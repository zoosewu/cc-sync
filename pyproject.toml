[project]
name = "cc-sync"
version = "0.1.0"
description = "Two-way sync of Claude Code user config across machines via git"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.scripts]
cc-sync = "cc_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
